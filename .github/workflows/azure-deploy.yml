name: Build and deploy to Azure Container Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ACR_NAME: cad972ac4b18acr
  RESOURCE_GROUP: rg-fastapi-lab
  APP_NAME: fastapi-lab-voievutska

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Build image
        run: docker build -t ${{ env.ACR_NAME }}.azurecr.io/fastapi-lab:${{ github.sha }} .
      - name: Push to ACR
        run: |
          az acr login --name ${{ env.ACR_NAME }}
          docker push ${{ env.ACR_NAME }}.azurecr.io/fastapi-lab:${{ github.sha }}
      - name: Deploy to Container Apps
        run: |
          az extension add --name containerapp --upgrade
          az containerapp update --name ${{ env.APP_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} --image ${{ env.ACR_NAME }}.azurecr.io/fastapi-lab:${{ github.sha }}
